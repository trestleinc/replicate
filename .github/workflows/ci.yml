name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Test replication contracts
        run: bun run test

      - name: Verify SQLite assets
        run: bun run --filter @trestleinc/replicate test:assets

      - name: Install Chromium
        working-directory: packages/replicate
        run: bunx playwright install --with-deps chromium

      - name: Test offline browser restarts
        run: bun run --filter @trestleinc/replicate test:browser

      - name: Lint
        run: bun run lint

      - name: Type check
        env:
          PUBLIC_CONVEX_URL: https://example.convex.cloud
        run: bun run check
